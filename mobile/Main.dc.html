<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
:root{
  --bg:#f5f3ef;
  --text:#2A211A;
  --text-dim:#5B4E43;
  --text-faint:#6B5D50;
  --primary:#5B4638;
  --primary-soft:rgba(91,70,56,.10);
  --primary-soft-2:rgba(91,70,56,.17);
  --shadow-d:#dad5cb;
  --shadow-l:#ffffff;
  --line:rgba(42,33,26,.09);
  --warn:#9c4a35;
  --warn-soft:rgba(156,74,53,.11);
  --good:#4d6a41;
  --good-soft:rgba(77,106,65,.12);
  --chart-2:#a3897a;
  --chart-3:#c9c1b6;
  --on-primary:#fdfcfa;
  --knob-shadow:rgba(42,33,26,.28);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:#e7e3db;display:flex;align-items:flex-start;justify-content:center;padding:26px 0;font-family:'DM Sans',system-ui,sans-serif;}
.serif{font-family:'Instrument Serif',Georgia,serif;}
.screen{
  width:390px;min-height:844px;background:var(--bg);color:var(--text);
  border-radius:44px;position:relative;overflow:hidden;
  box-shadow:0 30px 60px rgba(42,33,26,.22), 0 2px 0 rgba(255,255,255,.6) inset;
}
.content{padding:26px 20px 118px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:26px 20px 4px;}
.brandrow{display:flex;align-items:center;gap:9px;}
.brandmark{width:26px;height:26px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:var(--bg);font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:15px;flex:none;}
.brandname{font-size:12.5px;font-weight:600;letter-spacing:.03em;color:var(--text-dim);text-transform:lowercase;}
.avatar{width:44px;height:44px;border-radius:15px;background:var(--bg);box-shadow:4px 4px 9px var(--shadow-d),-4px -4px 9px var(--shadow-l);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--primary);}
.backrow{display:flex;align-items:center;gap:12px;padding:26px 20px 2px;}
.iconbtn{width:44px;height:44px;border-radius:15px;background:var(--bg);box-shadow:4px 4px 9px var(--shadow-d),-4px -4px 9px var(--shadow-l);display:flex;align-items:center;justify-content:center;color:var(--text);flex:none;}
.iconbtn svg{width:19px;height:19px;}
.tapicon{width:32px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--text-faint);flex:none;}
.tapicon svg{width:16px;height:16px;}
.crumb{font-size:12px;color:var(--text-faint);font-weight:500;}
.pagetitle{font-size:23px;font-weight:700;letter-spacing:-.01em;margin:2px 0 0;}
.raised{background:var(--bg);border-radius:20px;box-shadow:7px 7px 15px var(--shadow-d),-7px -7px 15px var(--shadow-l);}
.raised-sm{background:var(--bg);border-radius:15px;box-shadow:5px 5px 11px var(--shadow-d),-5px -5px 11px var(--shadow-l);}
.pressed{background:var(--bg);border-radius:16px;box-shadow:inset 4px 4px 9px var(--shadow-d),inset -4px -4px 9px var(--shadow-l);}
.pressed-pill{background:var(--bg);border-radius:999px;box-shadow:inset 3px 3px 7px var(--shadow-d),inset -3px -3px 7px var(--shadow-l);}
.card{padding:20px;margin-bottom:16px;}
.label{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin:0 0 10px;}
.row{display:flex;align-items:center;gap:12px;}
.between{display:flex;align-items:center;justify-content:space-between;}
.btn{border:none;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-primary{background:var(--primary);color:var(--on-primary);border-radius:16px;padding:16px;font-size:15px;box-shadow:7px 7px 15px rgba(91,70,56,.32),-3px -3px 9px rgba(255,255,255,.55);}
.btn-ghost{background:var(--bg);color:var(--text);border-radius:16px;padding:14px;font-size:13.5px;box-shadow:5px 5px 11px var(--shadow-d),-5px -5px 11px var(--shadow-l);}
.btn-text{background:none;color:var(--warn);font-size:13.5px;font-weight:600;padding:6px 0;}
.field{padding:14px 16px;margin-bottom:14px;}
.field .label{margin-bottom:6px;}
.field input, .field .val{border:none;background:none;outline:none;font-family:'DM Sans',sans-serif;font-size:14.5px;color:var(--text);width:100%;padding:0;}
.field input::placeholder{color:var(--text-faint);}
.pill{padding:11px 16px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--text-dim);white-space:nowrap;}
.pill.active{color:var(--primary);}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;}
.badge.warn{background:var(--warn-soft);color:var(--warn);}
.badge.good{background:var(--good-soft);color:var(--good);}
.badge.primary{background:var(--primary-soft-2);color:var(--primary);}
.navbar{position:absolute;left:0;right:0;bottom:0;height:96px;padding:12px 12px 30px;background:var(--bg);box-shadow:0 -10px 22px var(--shadow-d),0 -1px 0 var(--shadow-l);display:flex;justify-content:space-between;align-items:center;}
.navitem{display:flex;flex-direction:column;align-items:center;gap:5px;width:58px;color:var(--text-faint);font-size:10px;font-weight:500;}
.navitem.active{color:var(--primary);font-weight:700;}
.navitem .icwrap{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;}
.navitem.active .icwrap{box-shadow:inset 3px 3px 7px var(--shadow-d),inset -3px -3px 7px var(--shadow-l);}
.navitem svg{width:20px;height:20px;}
.stepper{display:flex;align-items:center;gap:8px;padding:0 20px 18px;}
.step-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;}
.step-dot.done{background:var(--primary);color:var(--on-primary);}
.step-dot.active{background:var(--bg);color:var(--primary);box-shadow:inset 3px 3px 6px var(--shadow-d),inset -3px -3px 6px var(--shadow-l);border:1.5px solid var(--primary);}
.step-dot.pending{background:var(--bg);color:var(--text-faint);box-shadow:3px 3px 7px var(--shadow-d),-3px -3px 7px var(--shadow-l);}
.step-line{flex:1;height:2px;background:var(--line);}
.step-line.done{background:var(--primary);opacity:.4;}
.quote{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:16px;line-height:1.4;color:var(--text-dim);}
.divider{height:1px;background:var(--line);margin:14px 0;}
a{color:var(--primary);}
a:hover{color:#42332a;}
</style>
</helmet>
<div class="screen">

<div style="min-height:844px;display:flex;flex-direction:column;justify-content:center;padding:0 32px;">
  <div style="display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:44px;">
    <div class="raised" style="width:68px;height:68px;border-radius:22px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;">
      <span class="serif" style="font-style:italic;font-size:32px;color:var(--primary);">p</span>
    </div>
    <div class="brandname" style="font-size:13px;margin-bottom:14px;">ateliê parágrafo</div>
    <div class="quote" style="font-size:23px;max-width:260px;">um respiro entre a produção e a venda</div>
  </div>

  <div class="pressed field">
    <div class="label">e-mail</div>
    <input type="text" placeholder="ana@ateliedaana.com" value="ana@ateliedaana.com"/>
  </div>
  <div class="pressed field between">
    <div style="flex:1;">
      <div class="label">senha</div>
      <input type="password" placeholder="••••••••" value="••••••••"/>
    </div>
    <div class="tapicon" role="button" aria-label="Mostrar senha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
  </div>

  <button class="btn btn-primary" style="width:100%;margin-top:8px;">Entrar</button>
  <div style="text-align:center;margin-top:18px;font-size:13px;color:var(--text-dim);">
    Primeira vez? <a href="#" style="font-weight:600;">Criar a conta da loja</a>
  </div>

  <div class="quote" style="text-align:center;margin-top:40px;font-size:15px;color:var(--text-faint);">
    "Que bom te ver por aqui.<br/>Vamos acender esse dia?"
  </div>
</div>

</div>
</x-dc>
</body>
</html>
